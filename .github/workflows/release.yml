name: Release

# Standard changesets two-step flow:
#   1. Push to main with pending changesets → workflow opens a Version Packages PR.
#   2. Merge the Version Packages PR → workflow publishes bumped packages to npm.
# `workflow_dispatch` is kept as a manual recovery lever.
on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'
                  registry-url: 'https://registry.npmjs.org/'
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - uses: changesets/action@v1
              with:
                  publish: pnpm release
                  version: pnpm changeset version
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # NPM_TOKEN remains as a fallback for packages that don't
                  # yet have trusted publishing configured. When trusted
                  # publishing is active (seo-graph-core), OIDC takes
                  # precedence and NPM_TOKEN is unused.
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  # Enable provenance attestation via GitHub's OIDC token.
                  # Requires `id-token: write` (set above) and trusted
                  # publisher configuration on npm for each published
                  # package. Adds a "verified publisher" badge on npmjs.com.
                  NPM_CONFIG_PROVENANCE: 'true'
