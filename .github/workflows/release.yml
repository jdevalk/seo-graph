name: Release

# Standard changesets two-step flow:
#   1. Push to main with pending changesets → workflow opens a Version Packages PR.
#   2. Merge the Version Packages PR → workflow publishes bumped packages to npm.
# `workflow_dispatch` is kept as a manual recovery lever.
on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'pnpm'
                  # Deliberately no `registry-url` here. When set, setup-node
                  # writes a `.npmrc` containing
                  # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
                  # and injects NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX as a
                  # placeholder. pnpm publish then reads that placeholder
                  # and tries to authenticate with garbage, which bypasses
                  # OIDC trusted publishing. Leaving `registry-url` off
                  # means no `.npmrc` is created, pnpm uses the default
                  # registry (npmjs.org), and trusted publishing can
                  # authenticate via the GitHub Actions OIDC token.
            # Node 22 ships with npm 10.x, which doesn't support OIDC
            # trusted publishing. Upgrade to 11.5.1+ so `changeset publish`
            # (which spawns `npm publish` per package) can complete the
            # OIDC token exchange with the npm registry. Without this,
            # publishes fail with ENEEDAUTH even though OIDC is available.
            #
            # Install into a separate global prefix so npm isn't trying
            # to upgrade itself in place — that hits a known bug where
            # npm removes its own dependencies mid-install and then
            # can't finish (MODULE_NOT_FOUND: promise-retry).
            - name: Install npm 11.x into a separate prefix
              run: |
                  mkdir -p "$HOME/.npm-global"
                  npm config set prefix "$HOME/.npm-global"
                  echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
                  npm install -g npm@latest
                  "$HOME/.npm-global/bin/npm" --version
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            # Publish any packages whose local version isn't on npm yet.
            #
            # Why this two-step (pnpm pack + npm publish) dance:
            # - `pnpm pack` correctly rewrites `workspace:*` deps to real
            #   version ranges in the packed tarball. `npm pack` and
            #   `npm publish` don't — they'd ship the literal `workspace:*`
            #   string, which consumers can't install (EUNSUPPORTEDPROTOCOL).
            # - `npm publish <tarball>` (npm 11.5.1+) performs the OIDC
            #   trusted publishing token exchange with the npm registry.
            #   `pnpm publish` doesn't do OIDC, and the changesets-cli
            #   spawn chain silently loses the OIDC env somewhere so its
            #   invocation of `npm publish` also fails with ENEEDAUTH.
            # Combining the two gives us: correct tarball contents +
            # working auth.
            #
            # The helper script skips packages whose current version is
            # already published, so reruns of the workflow are safe.
            - name: Publish packages (pnpm pack + npm publish)
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  for pkg in seo-graph-core astro-seo-graph; do
                      cd "packages/$pkg"
                      name=$(node -p "require('./package.json').name")
                      version=$(node -p "require('./package.json').version")
                      tag="$name@$version"
                      if npm view "$name@$version" version >/dev/null 2>&1; then
                          echo "::notice::$name@$version already published, skipping"
                      else
                          echo "::notice::publishing $name@$version"
                          tarball=$(pnpm pack 2>/dev/null | tail -1)
                          npm publish "$tarball" --access=public --provenance
                          rm "$tarball"

                          # Create a matching GitHub Release, using the
                          # just-bumped section of this package's CHANGELOG
                          # as the release notes. Non-fatal: publishing
                          # already succeeded, don't block on release UI.
                          if gh release view "$tag" >/dev/null 2>&1; then
                              echo "::notice::release $tag already exists"
                          else
                              notes=$(awk -v ver="$version" '
                                  $0 == "## " ver { flag=1; next }
                                  flag && /^## / { exit }
                                  flag { print }
                              ' CHANGELOG.md)
                              if [ -z "$notes" ]; then
                                  notes="Release $tag."
                              fi
                              gh release create "$tag" \
                                  --title "$tag" \
                                  --notes "$notes" \
                                  --target "$GITHUB_SHA" \
                                  || echo "::warning::failed to create release $tag"
                          fi
                      fi
                      cd ../..
                  done
            # changesets/action handles the "Version Packages" PR only:
            # running `pnpm changeset version` to consume pending
            # changesets, bump versions, update CHANGELOGs, and open a
            # PR. Publishing is done by the dedicated `Publish packages`
            # step above — NOT by changesets/action — because
            # @changesets/publish spawns `npm publish` via pnpm in a way
            # that loses the OIDC env, so trusted publishing can't
            # complete. Our pack+publish loop runs `npm publish` directly
            # with OIDC intact.
            - uses: changesets/action@v1
              with:
                  version: pnpm changeset version
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'
