name: Release

# Standard changesets two-step flow:
#   1. Push to main with pending changesets → workflow opens a Version Packages PR.
#   2. Merge the Version Packages PR → workflow publishes bumped packages to npm.
# `workflow_dispatch` is kept as a manual recovery lever.
on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'
                  registry-url: 'https://registry.npmjs.org/'
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - uses: changesets/action@v1
              with:
                  publish: pnpm release
                  version: pnpm changeset version
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # No NPM_TOKEN by design: both @jdevalk/seo-graph-core
                  # and @jdevalk/astro-seo-graph use OIDC trusted
                  # publishing (configured on npmjs.com → Settings →
                  # Publishing access → Trusted publisher → GitHub
                  # Actions → jdevalk/seo-graph → release.yml). If a
                  # token were set here it would take precedence over
                  # OIDC and trusted publishing would never be reached —
                  # that was the cause of the E404 publish failures on
                  # versions 0.2.0 / 0.2.1 / 0.2.2 before this fix.
                  #
                  # To add a new publishable package, configure trusted
                  # publishing for it on npmjs.com first, then add its
                  # changeset.
                  NPM_CONFIG_PROVENANCE: 'true'
