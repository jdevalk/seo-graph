name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    # Primary gate. Runs against the committed lockfile (Astro 7) with the
    # integrity check intact, so lockfile drift still fails CI.
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            # Build first: packages downstream from seo-graph-core need its
            # dist/*.d.ts to exist before their typecheck can resolve the
            # workspace dep.
            - run: pnpm build
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm format:check

    # Astro 6 compatibility leg. The committed lockfile pins Astro 7, so this
    # job re-resolves astro@^6 and therefore can't use --frozen-lockfile. It
    # verifies the widened peer range still builds/typechecks/tests on the
    # older major; formatting is major-independent and covered by `check`.
    astro6-compat:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --no-frozen-lockfile
            - name: Pin Astro 6
              run: pnpm --filter @jdevalk/astro-seo-graph add -D astro@^6
            - run: pnpm build
            - run: pnpm typecheck
            - run: pnpm test
