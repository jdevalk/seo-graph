name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            # Build first: packages downstream from seo-graph-core need its
            # dist/*.d.ts to exist before their typecheck can resolve the
            # workspace dep.
            - run: pnpm build
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm format:check
